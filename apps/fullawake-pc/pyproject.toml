[project]
name = "fullawake"
version = "0.2.7"
description = "Sensory and embodiment gateway connecting phone Xiaoman (DSHA) to PC desktop capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.0",
    "mcp>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pillow>=10.0.0",
    "mss>=9.0.0",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
widget = ["wsproto>=1.2.0", "PySide6-Addons>=6.8,<6.12; sys_platform == 'win32'"]
vad = ["sounddevice>=0.5.6,<0.6", "webrtcvad-wheels>=2.0.14,<3"]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fullawake"]

[tool.uv.sources]
wsproto = { index = "tsinghua" }
pyside6-addons = { index = "tsinghua" }
sounddevice = { index = "tsinghua" }
webrtcvad-wheels = { index = "tsinghua" }

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
explicit = true
